# What the battery is planned to do, interval by interval, over your buy and
# sell prices. Bars show the price paid (charge) or the value per kWh
# (discharge: the buy price avoided when it covers the house, the sell price
# when it is exported) in each planned interval. Covers the rest of today and
# tomorrow once published, and follows the plan as it is redone. Needs
# apexcharts-card (HACS -> Frontend).
# If the plan is empty, the planner found nothing worth doing for your
# settings (see the "Arbitrage profitable" sensors).
# ENTITY IDS: the plan is the Battery Planner "Plan" sensor. Home Assistant
# prefixes the area of the device to entities created while it sits in an area
# (e.g. sensor.server_battery_planner_plan). If a series says "Entity not
# available", look up the real id under Settings -> Devices & services and
# replace it in the card.
type: custom:apexcharts-card
header:
  show: true
  title: Battery plan
graph_span: 48h
span:
  start: minute
now:
  show: true
  label: Now
  color: "#e74c3c"
series:
  - entity: sensor.battery_planner_plan
    name: Buy price
    type: line
    curve: stepline
    color: "#ff4757"
    stroke_width: 2
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || []).map(r => [new Date(r.start).getTime(), r.buy]);
  - entity: sensor.battery_planner_plan
    name: Sell price
    type: line
    curve: stepline
    color: "#ffa502"
    stroke_width: 2
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || []).map(r => [new Date(r.start).getTime(), r.sell]);
  - entity: sensor.battery_planner_plan
    name: Charge from the grid
    type: column
    color: "#2ed573"
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || [])
        .filter(r => r.action === 'charge')
        .map(r => [new Date(r.start).getTime(), r.buy]);
  - entity: sensor.battery_planner_plan
    name: Discharge
    type: column
    color: "#9b59b6"
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || [])
        .filter(r => r.action === 'discharge')
        .map(r => [new Date(r.start).getTime(), (r.to_house_kwh * r.buy + r.export_kwh * r.sell) / r.discharge_kwh]);
