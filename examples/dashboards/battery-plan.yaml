# What the battery is planned to do, interval by interval, over your buy and
# sell prices. Bars show the price paid (charge), the buy price avoided when the
# battery covers the house (purple), and the sell price when it exports to the
# grid (pink) in each planned interval. Covers the rest of today and
# tomorrow once published, and follows the plan as it is redone. Needs
# apexcharts-card (HACS -> Frontend).
# If the plan is empty, the planner found nothing worth doing for your
# settings (see the "Arbitrage profitable" sensors).
# ENTITY IDS: the plan is the Battery Planner "Plan" sensor. Home Assistant
# prefixes the area of the device to entities created while it sits in an area
# (e.g. sensor.server_battery_planner_plan). If a series says "Entity not
# available", look up the real id under Settings -> Devices & services and
# replace it in the card.
type: custom:apexcharts-card
header:
  show: true
  title: Battery plan
graph_span: 48h
span:
  start: day
now:
  show: true
  label: Now
  color: "#e74c3c"
series:
  - entity: sensor.battery_planner_plan
    extend_to: false
    name: Buy price
    type: line
    curve: stepline
    color: "#ff4757"
    stroke_width: 2
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || []).map(r => [new Date(r.start).getTime(), r.buy]);
  - entity: sensor.battery_planner_plan
    extend_to: false
    name: Sell price
    type: line
    curve: stepline
    color: "#ffa502"
    stroke_width: 2
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || []).map(r => [new Date(r.start).getTime(), r.sell]);
  - entity: sensor.battery_planner_plan
    extend_to: false
    name: Charge from the grid
    type: column
    color: "#2ed573"
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || [])
        .filter(r => r.charge_kwh > 0.02)  // ignore rounding dust
        .map(r => [new Date(r.start).getTime(), r.buy]);
  - entity: sensor.battery_planner_plan
    extend_to: false
    name: Charge from the sun
    type: column
    color: "#f1c40f"
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || [])
        .filter(r => r.charge_kwh <= 0.02 && r.solar_to_battery_kwh > 0.01)
        .map(r => [new Date(r.start).getTime(), r.sell]);
  - entity: sensor.battery_planner_plan
    extend_to: false
    name: Battery to the house
    type: column
    color: "#9b59b6"
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || [])
        .filter(r => r.to_house_kwh > 0.02)  // ignore rounding dust
        .map(r => [new Date(r.start).getTime(), r.buy]);
  - entity: sensor.battery_planner_plan
    extend_to: false
    name: Export to the grid
    type: column
    color: "#e84393"
    float_precision: 4
    show:
      in_header: false
    data_generator: |
      return (entity.attributes.plan || [])
        .filter(r => r.export_kwh > 0.02)
        .map(r => [new Date(r.start).getTime(), r.sell]);
